name: emotic-matched

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pytorch=2.4.*
  - torchvision=0.19.*
  - pytorch-cuda=12.1
  - numpy=1.26.*
  - scipy=1.13.*
  - scikit-learn=1.5.*
  - pandas=2.2.*
  - pillow=10.*
  - opencv=4.10.*
  - tqdm=4.66.*
  - pyyaml=6.*
  - pip>=24
  - setuptools<81
  - pip:
      - openai-clip==1.0.1
      - insightface==0.7.3
      - onnxruntime-gpu==1.18.1
