name: emotionclip-local

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pytorch=2.4.*
  - torchvision=0.19.*
  - pytorch-cuda=12.1
  - numpy=1.26.*
  - scipy=1.13.*
  - scikit-learn=1.5.*
  - pillow=10.*
  - h5py=3.*
  - tqdm=4.66.*
  - lightning=2.*
  - hydra-core=1.*
  - pip>=24
  - setuptools<81
  - pip:
      - openai-clip==1.0.1
      - lmdb>=1.4,<2
